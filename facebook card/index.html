<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>storybook</h1>

        <p class="my">
            Connect and share with the people in your life.
        </p>

        <div class="box">

            <form>
             <label for ="email"></label>
             <input type="email" id="email" placeholder="Email or phone number" required>


                <label for="password"></label>
                <input type="password" id="password" placeholder="Password" required>

                <input type="submit" value="Log In" class="login-btn">

                <a href="https://www.facebook.com/login/identify/" class="forgot"> Forgotten password?</a>
                <hr>

                 <a href="https://www.facebook.com/signup/" class="create-btn"> Create a new account</a>
            </form>

        </div>


    </div>

</body>

</html>
